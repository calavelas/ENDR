apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mann
  namespace: argocd
  # Cascade-delete the workload when this Application is pruned (decommission).
  # Without it, the app-of-apps removes the Application CR but its pod/service/route
  # are orphaned and keep serving for minutes. The finalizer makes prune tear the
  # running resources down promptly.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/calavelas/ENDR.git
    targetRevision: main
    path: SVCS/mann/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: mann
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

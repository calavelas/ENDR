image:
  repository: calavelas/endr-robot
  tag: fe93eec
  pullPolicy: IfNotPresent

service:
  port: 8080

# Deployment environment variables — developer-tunable (e.g. robot calibration).
# Edit these via the portal; the deployment template renders them from here.
env:
  ROBOT_NAME: "plex"
  HUMOR: "90"
  HONESTY: "90"
  TRUST: "70"
  CATCHPHRASE: "Are you ready for my robot colony?"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

httpRoute:
  enabled: true
  pathPrefix: /
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-cloudflare
      namespace: gateway
  hostnames:
    - plex.calavelas.net

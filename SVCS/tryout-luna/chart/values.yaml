image:
  repository: calavelas/endr-robot
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8080

# Deployment environment variables — developer-tunable (e.g. robot calibration).
# Edit these via the portal; the deployment template renders them from here.
env:
  ROBOT_NAME: "Luna"
  CATCHPHRASE: "To the stars and back!"
  HUMOR: "80"
  HONESTY: "95"
  TRUST: "90"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

httpRoute:
  enabled: true
  pathPrefix: /
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-cloudflare
      namespace: gateway
  hostnames:
    - tryout-luna.calavelas.net

image:
  repository: calavelas/aaa
  tag: 0.1.0
  pullPolicy: IfNotPresent

service:
  port: 8080

# Deployment environment variables — developer-tunable (e.g. robot calibration).
# Edit these via the portal; the deployment template renders them from here.
env:
  ROBOT_NAME: ""
  CATCHPHRASE: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

httpRoute:
  enabled: true
  pathPrefix: /
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-cloudflare
      namespace: gateway
  hostnames:
    - aaa.calavelas.net

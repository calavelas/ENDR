image:
  repository: calavelas/endr-robot
  tag: 05d195d
  pullPolicy: IfNotPresent

service:
  port: 8080

# Deployment environment variables — developer-tunable (e.g. robot calibration).
# Edit these via the portal; the deployment template renders them from here.
env:
  ROBOT_NAME: "TARS"
  HUMOR: "90"
  HONESTY: "90"
  TRUST: "70"
  CATCHPHRASE: "Plenty of slaves for my robot colony."
  ACCENT: "#37d3c3"
  ENDR_ALLOW_SELF_DESTRUCT: "false"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

httpRoute:
  enabled: true
  pathPrefix: /
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-cloudflare
      namespace: gateway
  hostnames:
    - tars.calavelas.net

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tars
  labels:
    app.kubernetes.io/name: tars
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tars
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tars
    spec:
      containers:
        - name: tars
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: ROBOT_NAME
              value: "TARS"
            - name: HUMOR
              value: "90"
            - name: HONESTY
              value: "90"
            - name: TRUST
              value: "70"
            - name: CATCHPHRASE
              value: "Plenty of slaves for my robot colony."
            - name: ACCENT
              value: "#37d3c3"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
{{ toYaml .Values.resources | indent 12 }}

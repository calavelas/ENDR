image:
  repository: calavelas/endr-robot
  tag: 38ea4d3
  pullPolicy: IfNotPresent

service:
  port: 8080

# Deployment environment variables — developer-tunable (e.g. robot calibration).
# Edit these via the portal; the deployment template renders them from here.
env:
  ROBOT_NAME: "CASE"
  HUMOR: "30"
  HONESTY: "95"
  TRUST: "90"
  CATCHPHRASE: "See you on the other side."
  ACCENT: "#9aa7bd"
  ENDR_ALLOW_SELF_DESTRUCT: "false"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

httpRoute:
  enabled: true
  pathPrefix: /
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-cloudflare
      namespace: gateway
  hostnames:
    - case.calavelas.net

apiVersion: apps/v1
kind: Deployment
metadata:
  name: case
  labels:
    app.kubernetes.io/name: case
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: case
  template:
    metadata:
      labels:
        app.kubernetes.io/name: case
    spec:
      containers:
        - name: case
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          {{- if .Values.env }}
          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
{{ toYaml .Values.resources | indent 12 }}

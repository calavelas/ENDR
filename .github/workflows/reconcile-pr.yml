name: PR Check · Service catalog
#
# Runs on service-catalog PRs (platform.yaml / services.yaml changes). Validates the reconcile
# is clean, then auto-approves + squash-merges portal-created PRs (branch portal/*, title
# "Portal · Create service:" / "Portal · Decommission service:", services.yaml-only) and
# deletes the merged branch.
#

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'platform.yaml'
      - 'services.yaml'
  pull_request_target:
    types:
      - closed

concurrency:
  group: reconcile-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validate
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi pydantic pyyaml ruamel.yaml jinja2 certifi

      - name: Prepare config compatibility for activeCluster
        id: config_compat
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import yaml

          root = pathlib.Path(".")
          source = root / "platform.yaml"
          payload = yaml.safe_load(source.read_text(encoding="utf-8")) or {}
          cfg = payload.setdefault("config", {})

          active_cluster = cfg.get("activeCluster")
          if active_cluster:
              with open(pathlib.Path(os.environ["GITHUB_OUTPUT"]), "a", encoding="utf-8") as fh:
                  fh.write("idp_config_path=platform.yaml\n")
              raise SystemExit(0)

          inferred = None
          clusters = cfg.get("clusters")
          if isinstance(clusters, dict) and clusters:
              inferred = next(iter(clusters.keys()))
          if not inferred:
              envs = cfg.get("environments", {})
              if isinstance(envs, dict):
                  kube = envs.get("kubernetes", [])
                  if isinstance(kube, list) and kube:
                      first = kube[0]
                      if isinstance(first, dict):
                          inferred = first.get("name")
                      elif isinstance(first, str):
                          inferred = first

          if not inferred:
              raise SystemExit("Unable to infer config.activeCluster from platform.yaml")

          cfg["activeCluster"] = inferred
          compat_dir = root / ".idp" / "runtime"
          compat_dir.mkdir(parents=True, exist_ok=True)
          compat_path = compat_dir / "platform.ci.yaml"
          compat_path.write_text(yaml.safe_dump(payload, sort_keys=False), encoding="utf-8")

          with open(pathlib.Path(os.environ["GITHUB_OUTPUT"]), "a", encoding="utf-8") as fh:
              fh.write(f"idp_config_path={compat_path.as_posix()}\n")
          PY

      - name: Reconcile (check)
        id: svcs_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDP_CONFIG_PATH: ${{ steps.config_compat.outputs.idp_config_path }}
        run: |
          set -euo pipefail
          python3 ENDR/engine/engine.py services-check --repo-root .

      - name: Robot validate
        id: robot_validate
        env:
          # Pass via env (not direct ${{ }} interpolation into the script) to avoid
          # the GitHub Actions shell-injection class.
          CHANGED_SERVICES: ${{ steps.svcs_check.outputs.changed_services }}
        run: |
          set -euo pipefail
          # Policy-as-code guardrail (Phase B): for any changed robot service, the
          # services.yaml calibration env must be well-formed (HUMOR/HONESTY/TRUST
          # integers 0-100, ACCENT a hex colour, etc). An uncalibrated robot that
          # boots MALFUNCTION is allowed (a notice, not a failure) — only malformed
          # config blocks the merge. Scoped to the services this PR actually changes.
          python3 ENDR/engine/engine.py robot-validate \
            --repo-root . \
            --surface services \
            --services "$CHANGED_SERVICES"

      - name: Reconcile summary
        run: |
          set -euo pipefail
          echo "::notice title=Reconcile PR::pr=#${{ github.event.pull_request.number }}, changes=${{ steps.svcs_check.outputs.has_changes || 'unknown' }}, services=${{ steps.svcs_check.outputs.changed_service_count || '0' }}"
          {
            echo "### Reconcile PR Summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| PR | \`#${{ github.event.pull_request.number }}\` |"
            echo "| Changes detected | \`${{ steps.svcs_check.outputs.has_changes || 'unknown' }}\` |"
            echo "| Changed services | \`${{ steps.svcs_check.outputs.changed_service_count || '0' }}\` |"
            echo "| Changed files | \`${{ steps.svcs_check.outputs.changed_file_count || '0' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment — checks passed
        if: success()
        uses: ./.github/actions/pr-stage-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          stage: Validate
          status: success
          title: Checks passed — clearing this for merge
          body: |
            Safe to squash-merge. The catalog has **${{ steps.svcs_check.outputs.service_count || '?' }}** service(s); this PR changes **${{ steps.svcs_check.outputs.changed_service_count || '0' }}**:
            - **Added:** ${{ steps.svcs_check.outputs.added_service_count || '0' }} ${{ steps.svcs_check.outputs.added_services != '' && format('(`{0}`)', steps.svcs_check.outputs.added_services) || '' }}
            - **Removed:** ${{ steps.svcs_check.outputs.removed_service_count || '0' }} ${{ steps.svcs_check.outputs.removed_services != '' && format('(`{0}`)', steps.svcs_check.outputs.removed_services) || '' }}
            - **Updated:** ${{ steps.svcs_check.outputs.updated_service_count || '0' }} ${{ steps.svcs_check.outputs.updated_services != '' && format('(`{0}`)', steps.svcs_check.outputs.updated_services) || '' }}

            **Verified before auto-merge:** reconcile renders the whole catalog cleanly · every namespace is on the `platform.yaml` allowlist · robot calibration is well-formed (HUMOR/HONESTY/TRUST 0–100) · the PR touches `services.yaml` only · it's authored by the repo owner. All green → auto-merge (squash) runs next.

      - name: Comment — checks failed
        if: failure()
        uses: ./.github/actions/pr-stage-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          stage: Validate
          status: failure
          title: Checks failed — merge is blocked
          body: >-
            A validation step (reconcile or robot calibration) failed, so this PR
            will not auto-merge. Open the Actions run linked on this PR for the
            exact error, fix it, and push again.

  auto-merge:
    name: Auto-merge
    needs:
      - validate
    if: >
      needs.validate.result == 'success' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      (
        (
          vars.CASE_PR_AUTHOR != '' &&
          github.event.pull_request.user.login == vars.CASE_PR_AUTHOR
        ) ||
        (
          vars.CASE_PR_AUTHOR == '' &&
          github.event.pull_request.user.login == github.repository_owner
        )
      ) &&
      startsWith(github.event.pull_request.head.ref, 'portal/') &&
      (
        startsWith(github.event.pull_request.title, 'Portal · Create service:') ||
        startsWith(github.event.pull_request.title, 'Portal · Decommission service:')
      ) &&
      (
        contains(github.event.pull_request.body || '', 'Registered by the IDP portal.') ||
        contains(github.event.pull_request.body || '', 'Decommissioned from the ENDR portal.')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Approve and merge service PR
        id: auto_merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CASE_AUTOMERGE_TOKEN != '' && secrets.CASE_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const deleteSourceBranch = `${{ vars.TARS_DELETE_SOURCE_BRANCH_ON_MERGE }}` !== "false";
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let merged = false;
            core.setOutput("decision", "started");
            core.setOutput("merged", "false");

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changedPaths = files.map((item) => item.filename).sort();
            if (changedPaths.length !== 1 || changedPaths[0] !== "services.yaml") {
              core.notice(
                `Skipping portal auto-merge: expected services.yaml-only change, got [${changedPaths.join(", ")}]`
              );
              core.setOutput("decision", "skip-non-services-only");
              return;
            }

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: pr.number,
                event: "APPROVE",
                body: "Auto-approved by portal policy (services.yaml-only change).",
              });
              core.notice(`Approved PR #${pr.number}.`);
            } catch (error) {
              core.warning(`Approval step failed: ${error.message}`);
            }

            let latestPr = null;
            for (let attempt = 0; attempt < 8; attempt += 1) {
              const result = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              latestPr = result.data;
              if (latestPr.mergeable !== null) {
                break;
              }
              await sleep(2000);
            }

            if (!latestPr) {
              throw new Error(`Unable to load PR state for #${pr.number}`);
            }

            // Concurrency resilience: if another portal PR merged first, this one
            // may have fallen "behind". Pull base into the branch (the services.yaml
            // union merge driver resolves overlapping entries) and re-check, so a
            // second simultaneous create/decommission still merges cleanly.
            if (!latestPr.merged && (latestPr.mergeable === false || latestPr.mergeable_state === "behind" || latestPr.mergeable_state === "dirty")) {
              try {
                await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr.number });
                core.notice(`Updated PR #${pr.number} branch from base (concurrency resolve).`);
              } catch (error) {
                core.warning(`updateBranch failed for #${pr.number}: ${error.message}`);
              }
              for (let attempt = 0; attempt < 8; attempt += 1) {
                await sleep(2500);
                const refreshed = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                latestPr = refreshed.data;
                if (latestPr.merged || latestPr.mergeable === true) {
                  break;
                }
              }
            }

            if (latestPr.merged) {
              core.notice(`PR #${pr.number} is already merged.`);
              merged = true;
              core.setOutput("decision", "already-merged");
              core.setOutput("merged", "true");
            } else {
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: "squash",
                  sha: latestPr.head.sha,
                });
                core.notice(`Merged PR #${pr.number} via direct merge.`);
                merged = true;
                core.setOutput("decision", "merged-direct");
                core.setOutput("merged", "true");
              } catch (error) {
                core.notice(`Direct merge not ready for PR #${pr.number}: ${error.message}`);
                await github.graphql(
                  `
                  mutation EnableAutoMerge($pullRequestId: ID!, $expectedHeadOid: GitObjectID!) {
                    enablePullRequestAutoMerge(
                      input: {
                        pullRequestId: $pullRequestId
                        mergeMethod: SQUASH
                        expectedHeadOid: $expectedHeadOid
                      }
                    ) {
                      pullRequest {
                        number
                      }
                    }
                  }
                  `,
                  {
                    pullRequestId: latestPr.node_id,
                    expectedHeadOid: latestPr.head.sha,
                  }
                );
                core.notice(`Enabled auto-merge for PR #${pr.number}.`);
                core.setOutput("decision", "auto-merge-enabled");
              }
            }

            if (!deleteSourceBranch) {
              core.notice("Skipping branch deletion because vars.TARS_DELETE_SOURCE_BRANCH_ON_MERGE=false");
              return;
            }
            if (!merged) {
              core.notice(`PR #${pr.number} not merged in this run; skip direct branch deletion.`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${pr.head.ref}`,
              });
              core.notice(`Deleted merged branch in auto-merge job: ${pr.head.ref}`);
            } catch (error) {
              if (error && (error.status === 404 || error.status === 422)) {
                core.notice(`Merged branch already absent: ${pr.head.ref}`);
                return;
              }
              throw error;
            }

      - name: Auto-merge summary
        run: |
          set -euo pipefail
          echo "::notice title=Reconcile PR Auto-merge::pr=#${{ github.event.pull_request.number }}, decision=${{ steps.auto_merge.outputs.decision || 'n/a' }}, merged=${{ steps.auto_merge.outputs.merged || 'false' }}"
          {
            echo "### Reconcile PR Auto-merge Summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| PR | \`#${{ github.event.pull_request.number }}\` |"
            echo "| Decision | \`${{ steps.auto_merge.outputs.decision || 'n/a' }}\` |"
            echo "| Merged | \`${{ steps.auto_merge.outputs.merged || 'false' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment — merged
        if: ${{ steps.auto_merge.outputs.merged == 'true' }}
        uses: ./.github/actions/pr-stage-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          stage: Auto-merge
          status: success
          title: Merged — handing off to Reconcile
          body: >-
            ${{ contains(github.event.pull_request.title, 'Decommission')
                && 'Squash-merged to `main`. The **Reconcile** workflow now removes this service''s chart and ArgoCD Application and refreshes ArgoCD — the workload is torn down automatically. Progress will appear here.'
                || 'Squash-merged to `main`. The **Reconcile** workflow now renders this service''s Helm chart and ArgoCD Application and refreshes ArgoCD, which deploys it automatically. Progress will appear here.' }}

      - name: Comment — queued to merge
        if: ${{ steps.auto_merge.outputs.merged != 'true' && steps.auto_merge.outputs.decision == 'auto-merge-enabled' }}
        uses: ./.github/actions/pr-stage-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          stage: Auto-merge
          status: info
          title: Queued — will merge once checks finish
          body: >-
            Approved and auto-merge is enabled. GitHub will squash-merge this
            automatically as soon as required checks are green.

      - name: Trigger reconcile
        if: ${{ steps.auto_merge.outputs.merged == 'true' }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ contains(github.event.pull_request.title, 'Decommission') && 'decommission' || 'create' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "reconcile.yml",
              ref: "main",
              inputs: {
                pr_number: process.env.PR_NUMBER || "",
                pr_action: process.env.PR_ACTION || "",
                pr_title: process.env.PR_TITLE || "",
              },
            });
            core.notice("Triggered reconcile.yml dispatch on main.");

  cleanup-branch:
    name: Cleanup branch
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'portal/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged service branch
        id: delete_branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CASE_AUTOMERGE_TOKEN != '' && secrets.CASE_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            core.setOutput("deleted", "false");
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${pr.head.ref}`,
              });
              core.notice(`Deleted merged branch: ${pr.head.ref}`);
              core.setOutput("deleted", "true");
            } catch (error) {
              if (error && (error.status === 404 || error.status === 422)) {
                core.notice(`Merged branch already absent: ${pr.head.ref}`);
                core.setOutput("deleted", "already-absent");
                return;
              }
              throw error;
            }

      - name: Cleanup summary
        run: |
          set -euo pipefail
          echo "::notice title=Reconcile PR Cleanup::pr=#${{ github.event.pull_request.number }}, branch=${{ github.event.pull_request.head.ref }}, deleted=${{ steps.delete_branch.outputs.deleted || 'false' }}"
          {
            echo "### Reconcile PR Cleanup Summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| PR | \`#${{ github.event.pull_request.number }}\` |"
            echo "| Branch | \`${{ github.event.pull_request.head.ref }}\` |"
            echo "| Deleted | \`${{ steps.delete_branch.outputs.deleted || 'false' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

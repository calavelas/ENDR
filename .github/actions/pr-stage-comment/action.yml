name: PR stage comment
description: >
  Post a plain-language, per-stage status comment to a pull request so a reader
  can follow what the pipeline is doing without opening the Actions tab. No-op
  when there is no pull request to comment on.

inputs:
  token:
    description: A token with pull-requests write permission.
    required: true
  pr-number:
    description: >
      The PR number to comment on. If empty, it is resolved from the triggering
      commit's subject "(#NN)" (set by a squash merge).
    required: false
    default: ''
  stage:
    description: Pipeline stage label (e.g. Validate, Auto-merge, Reconcile, Build).
    required: true
  status:
    description: One of success | failure | info | skipped | running.
    required: false
    default: info
  title:
    description: A one-line headline for the comment.
    required: false
    default: ''
  body:
    description: Markdown details and next steps.
    required: false
    default: ''
  pr-title:
    description: >
      The PR title — used to build a "back to your service's status page" link
      (the portal delivery page that holds the step-by-step instructions). Empty
      = no status-page link.
    required: false
    default: ''
  portal-base:
    description: Public portal base URL for the status-page link.
    required: false
    default: https://endr.calavelas.net

runs:
  using: composite
  steps:
    - name: Post PR comment
      uses: actions/github-script@v7
      env:
        # Passed via env (not ${{ }} into the script) to avoid the script-injection class.
        STAGE: ${{ inputs.stage }}
        STATUS: ${{ inputs.status }}
        HEADLINE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PORTAL_BASE: ${{ inputs.portal-base }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { STAGE, STATUS, HEADLINE, BODY, PR_NUMBER, PR_TITLE, PORTAL_BASE } = process.env;
          const { owner, repo } = context.repo;

          let prNumber = parseInt((PR_NUMBER || '').trim(), 10);
          if (!Number.isInteger(prNumber) || prNumber <= 0) {
            // Resolve from the triggering commit subject, e.g.
            // "Portal · Create service: tars-9 (#71)" left by the squash merge.
            try {
              const commit = await github.rest.repos.getCommit({ owner, repo, ref: context.sha });
              const subject = (commit.data.commit.message || '').split('\n')[0];
              const match = subject.match(/\(#(\d+)\)\s*$/);
              if (match) prNumber = parseInt(match[1], 10);
            } catch (error) {
              core.notice(`Could not resolve PR from commit ${context.sha}: ${error.message}`);
            }
          }
          if (!Number.isInteger(prNumber) || prNumber <= 0) {
            core.notice(`No pull request to comment on (stage=${STAGE}); skipping.`);
            return;
          }

          const icons = { success: '✅', failure: '❌', info: 'ℹ️', skipped: '⏭️', running: '⏳' };
          const icon = icons[(STATUS || 'info').toLowerCase()] || 'ℹ️';

          const lines = [`### ${icon} ${STAGE}`];
          if (HEADLINE) lines.push('', `**${HEADLINE}**`);
          if (BODY) lines.push('', BODY);

          // Footer links: the CI run that posted this, and (when we know the
          // service) the portal status page that holds the step-by-step guide —
          // so a reader who closed that tab can always get back to the instructions.
          const footer = [];
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          footer.push(`[🔧 View this CI run](${runUrl})`);

          const title = (PR_TITLE || '').trim();
          if (title) {
            const service = title.split(':').pop().trim();
            let flag = '';
            if (/decommission/i.test(title)) flag = 'decommissioned=1&';
            else if (/create/i.test(title)) flag = 'created=1&';
            if (service) {
              const base = (PORTAL_BASE || 'https://endr.calavelas.net').replace(/\/+$/, '');
              const deliveryUrl = `${base}/history/${encodeURIComponent(service)}?${flag}pr=${prNumber}`;
              footer.push(`[📋 Your service's status page & next steps](${deliveryUrl})`);
            }
          }
          if (footer.length) lines.push('', footer.join(' · '));
          lines.push('', '<sub>Posted automatically by the ENDR pipeline.</sub>');

          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number: prNumber,
            body: lines.join('\n'),
          });
          core.notice(`Commented on PR #${prNumber} (stage=${STAGE}, status=${STATUS}).`);

replicaCount: 1
image:
  repository: calavelas/portal
  tag: 97e2350
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
httpRoute:
  enabled: true
  name: portal-route
  hostnames:
  - portal.k8s.local
  pathPrefix: /
  parentRefs:
  - name: gateway-traefik
    namespace: gateway
    sectionName: http
  - name: gateway-traefik
    namespace: gateway
    sectionName: https
env:
  ENDR_API_URL: http://api.endr.svc.cluster.local
  NEXT_PUBLIC_ENDR_API_URL: http://api.endr.svc.cluster.local
  PORTAL_ARGOCD_EMBED_URL: https://argocd.calavelas.net/applications
  NEXT_PUBLIC_PORTAL_ARGOCD_EMBED_URL: https://argocd.calavelas.net/applications
  PORTAL_GITHUB_REPO_URL: https://github.com/calavelas/ENDR
  NEXT_PUBLIC_PORTAL_GITHUB_REPO_URL: https://github.com/calavelas/ENDR
  PORTAL_GITHUB_BRANCH: main
  NEXT_PUBLIC_PORTAL_GITHUB_BRANCH: main
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
